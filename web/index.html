<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>How to Drive</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app" aria-label="Circuito de conducción"></main>
    <aside id="talk" aria-label="Decisiones de conducción">
      <div id="voice" role="status">Micrófono desactivado</div>
      <section>
        <h2>Transcripción</h2>
        <p id="transcript">—</p>
      </section>
      <section>
        <h2>Decisión de Kev</h2>
        <strong id="decision">—</strong>
        <div class="metric"><span>Probabilidad de la acción elegida</span><b id="probability">—</b></div>
        <meter id="confidence" min="0" max="1" value="0" aria-label="Probabilidad de la acción"></meter>
        <div class="metric"><span>Probabilidad de orden inmediata</span><b id="gate">—</b></div>
      </section>
      <button id="load">Activar voz</button>
    </aside>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
