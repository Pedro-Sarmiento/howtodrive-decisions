<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>How to Drive</title>
    <style>
      html, body { margin: 0; height: 100%; background: #04030c; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; }
      #hud {
        position: fixed; left: 16px; top: 16px; padding: 10px 14px;
        font: 14px/1.5 ui-monospace, monospace; color: #f3ebc8; white-space: pre;
        background: rgba(4, 3, 12, 0.55); border-radius: 8px; pointer-events: none;
      }
      #keys { position: fixed; left: 16px; bottom: 16px; font: 12px ui-monospace, monospace; color: #9089a0; }
      #talk { position: fixed; right: 16px; bottom: 16px; max-width: 46vw; text-align: right;
        font: 13px/1.5 ui-monospace, monospace; color: #f3ebc8; }
      #voice { color: #ffb04a; }
      #last { color: #9089a0; white-space: pre-wrap; }
      #ptt { display: block; margin: 8px 0 0 auto; padding: 14px 22px; font: inherit; font-size: 16px;
        color: #f3ebc8; background: rgba(94, 67, 145, 0.85); border: 0; border-radius: 10px;
        touch-action: none; user-select: none; -webkit-user-select: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">loading…</div>
    <div id="keys">G start · S stop · A left · D right · B back · mejor en Chrome (en Brave la IA tarda 20 veces más)</div>
    <div id="talk">
      <div id="voice">cargando voz…</div>
      <div id="last"></div>
      <button id="ptt">mantén pulsado y habla (o espacio)</button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
